{% extends "base.html" %}

{% block content %}

<style>
    .edit-page {
        width: 100%;
        min-height: 85vh;
        padding: 45px 16px;
        background: #f1f5f9;
    }

    .edit-card {
        width: 100%;
        max-width: 750px;
        margin: auto;
        background: #fff;
        border-radius: 24px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.10);
        overflow: hidden;
    }

    .edit-header {
        background: linear-gradient(135deg, #f59e0b, #fbbf24);
        padding: 24px;
        color: #111827;
        text-align: center;
    }

    .edit-header h4 {
        margin: 0;
        font-weight: 900;
    }

    .edit-body {
        padding: 30px;
    }

    .form-label {
        font-weight: 700;
    }

    .form-control {
        border-radius: 12px;
        padding: 12px;
    }

    .form-control:focus {
        border-color: #14b8a6;
        box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2);
    }

    .btn-update {
        background: #16a34a;
        color: white;
        font-weight: 800;
        border-radius: 50px;
        padding: 10px 24px;
    }

    .btn-update:hover {
        background: #15803d;
        color: white;
    }

    .btn-cancel {
        border-radius: 50px;
        padding: 10px 24px;
        font-weight: 800;
    }

    .current-file {
        background: #f8fafc;
        padding: 12px;
        border-radius: 10px;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
    }

    .file-name {
        font-weight: 600;
        color: #334155;
        word-break: break-all;
    }

    .btn-open {
        background: #0ea5e9;
        color: white;
        border-radius: 50px;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 700;
    }

    .btn-open:hover {
        background: #0284c7;
        color: white;
    }

    @media (max-width: 576px) {
        .edit-page {
            padding: 25px 10px;
        }

        .edit-body {
            padding: 20px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-buttons .btn {
            width: 100%;
        }
    }
</style>

<section class="edit-page">
    <div class="edit-card">

        <div class="edit-header">
            <h4>✏️ Edit Note</h4>
        </div>

        <div class="edit-body">

            <!-- UPDATED TIME -->
            {% if note.updated_at %}
            <p class="text-muted small mb-3 text-center">
                Last updated: {{ note.updated_at.strftime("%d %b %Y, %I:%M %p") }}
            </p>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">

                <!-- TITLE -->
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text"
                        name="title"
                        value="{{ note.title }}"
                        class="form-control"
                        required>
                </div>

                <!-- CONTENT -->
                <div class="mb-3">
                    <label class="form-label">Content</label>
                    <textarea name="content"
                        class="form-control"
                        rows="5"
                        style="resize: none;"
                        required>{{ note.content }}</textarea>
                </div>

                <!-- CURRENT FILE -->
                {% if note.file_name %}
                <div class="mb-3 current-file">
                    <span class="file-name">
                        📎 {{ note.file_name }}
                    </span>

                    <a href="{{ url_for('uploaded_file', filename=note.file_name) }}"
                        class="btn btn-open"
                        target="_blank">
                        Open
                    </a>
                </div>
                {% endif %}

                <!-- NEW FILE -->
                <div class="mb-4">
                    <label class="form-label">Replace File (optional)</label>
                    <input type="file" name="file" class="form-control" accept=".pdf,.jpg,.png">
                </div>

                <!-- BUTTONS -->
                <div class="action-buttons d-flex gap-2">
                    <button type="submit"
                        class="btn btn-update"
                        onclick="return confirm('Are you sure you want to update this note?')">
                        Update Note
                    </button>

                    <a href="/viewall" class="btn btn-secondary btn-cancel">
                        Cancel
                    </a>
                </div>

            </form>

        </div>

    </div>
</section>

{% endblock %}
