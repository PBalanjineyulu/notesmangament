{% extends "base.html" %}

{% block content %}

<style>
    .addnote-page {
        width: 100%;
        min-height: 85vh;
        padding: 50px 16px;
        background: #f1f5f9;
        overflow-x: hidden;
    }

    .addnote-card {
        width: 100%;
        max-width: 760px;
        margin: auto;
        background: #ffffff;
        border-radius: 26px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.10);
        overflow: hidden;
    }

    .addnote-header {
        background: linear-gradient(135deg, #2563eb, #14b8a6);
        color: white;
        padding: 28px;
        text-align: center;
    }

    .addnote-header h4 {
        margin: 0;
        font-weight: 900;
    }

    .addnote-header p {
        margin: 6px 0 0;
        opacity: 0.9;
    }

    .addnote-body {
        padding: 34px;
    }

    .form-label {
        font-weight: 800;
        color: #0f172a;
        font-size: 14px;
    }

    .form-control {
        border-radius: 14px;
        padding: 12px 14px;
        border: 1px solid #d1d5db;
    }

    .form-control:focus {
        border-color: #14b8a6;
        box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.18);
    }

    textarea {
        resize: none;
    }

    .save-btn {
        border: none;
        border-radius: 50px;
        padding: 11px 28px;
        font-weight: 800;
        background: linear-gradient(135deg, #2563eb, #14b8a6);
        color: white;
    }

    .save-btn:hover {
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25);
    }

    .cancel-btn {
        border-radius: 50px;
        padding: 11px 28px;
        font-weight: 800;
        background: #e5e7eb;
        color: #111827;
        border: none;
    }

    .cancel-btn:hover {
        background: #d1d5db;
        color: #111827;
    }

    @media (max-width: 576px) {
        .addnote-page {
            padding: 28px 12px;
        }

        .addnote-body {
            padding: 24px 18px;
        }

        .addnote-card {
            border-radius: 20px;
        }

        .action-buttons {
            display: grid;
            gap: 10px;
        }

        .save-btn,
        .cancel-btn {
            width: 100%;
        }
    }
</style>

<section class="addnote-page">
    <div class="addnote-card">

        <div class="addnote-header">
            <h4>📝 Add New Note</h4>
            <p>Capture your ideas, tasks, and reminders quickly.</p>
        </div>

        <div class="addnote-body">
            <form method="POST" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label">Title *</label>
                    <input type="text" name="title" class="form-control"
                        placeholder="Enter note title" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Content *</label>
                    <textarea name="content" class="form-control" rows="6"
                        placeholder="Write your note content here..." required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label">Upload File (optional)</label>
                    <input type="file" name="file" class="form-control">
                </div>

                <div class="action-buttons d-flex gap-2">
                    <button class="btn save-btn" type="submit">
                        Save Note
                    </button>

                    <a href="/dashboard" class="btn cancel-btn">
                        Cancel
                    </a>
                </div>

            </form>
        </div>

    </div>
</section>

{% endblock %}
