{% extends "base.html" %}

{% block content %}

<style>
    body {
        background:
            radial-gradient(circle at top left, rgba(255, 193, 7, 0.25), transparent 35%),
            linear-gradient(135deg, #0f172a 0%, #1e293b 45%, #f8fafc 45%, #f8fafc 100%);
        min-height: 100vh;
    }

    .register-section {
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 40px 10px;
    }

    /* LEFT SIDE */
    .brand-panel {
        color: #fff;
        padding: 20px 30px;
    }

    .brand-badge {
        background: rgba(255, 193, 7, 0.15);
        color: #ffc107;
        padding: 8px 16px;
        border-radius: 50px;
        font-weight: 700;
        display: inline-block;
        margin-bottom: 18px;
    }

    .brand-panel h1 {
        font-weight: 900;
        font-size: clamp(2rem, 5vw, 3.5rem);
    }

    .brand-panel p {
        color: #cbd5e1;
        margin-top: 15px;
        max-width: 500px;
    }

    /* CARD */
 .register-card {
    width: 100%;
    max-width: 650px;
    margin: auto;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 26px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.25);
    overflow: hidden;
}

    .card-top {
        background: linear-gradient(135deg, #ffc107, #ff9900);
        padding: 30px;
        text-align: center;
    }

    .card-top h4 {
        font-weight: 900;
        margin: 0;
    }

    .card-top p {
        margin: 5px 0 0;
        font-weight: 600;
    }

    .form-area {
        padding: 45px;
    }

    /* INPUTS */
    .form-label {
        font-weight: 700;
        font-size: 14px;
    }

    .input-group-text {
        border-radius: 12px 0 0 12px;
        border-right: 0;
        background: #f1f5f9;
    }

    .form-control {
        height: 54px;
        border-radius: 0 12px 12px 0;
        border-left: 0;
    }

    .form-control:focus {
        border-color: #ff9900;
        box-shadow: none;
    }

    .input-group:focus-within {
        box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.25);
        border-radius: 12px;
    }

    /* BUTTON */
    .submit-btn {
        height: 55px;
        border-radius: 50px;
        border: none;
        background: linear-gradient(135deg, #111827, #1e293b);
        color: #fff;
        font-weight: 800;
        transition: 0.3s;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        background: linear-gradient(135deg, #1e293b, #111827);
        color: #ffc107;
        box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }

    .login-link {
        font-weight: 700;
        color: #007185;
        text-decoration: none;
    }

    .login-link:hover {
        color: #c7511f;
    }

    /* RESPONSIVE */
/* ================= TABLET ================= */
@media (max-width: 991px) {

    body {
        background: linear-gradient(135deg, #0f172a, #1e293b);
    }

    .register-section {
        padding: 20px 10px;
    }

    .brand-panel {
        text-align: center;
        padding: 20px;
    }

    .brand-panel p {
        margin-left: auto;
        margin-right: auto;
    }

    .feature-box {
        justify-content: center;
    }

    .register-card {
        max-width: 90%;
    }
}


/* ================= MOBILE ================= */
@media (max-width: 576px) {

    /* remove side gaps */
    .register-section {
        padding: 0 !important;
    }

    .container-fluid {
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    .row {
        margin: 0 !important;
    }

    /* FULL WIDTH CARD */
    .register-card {
        width: 100%;
        max-width: 100%;
        border-radius: 0;
        min-height: 100vh;
        box-shadow: none;
    }

    /* HEADER */
    .card-top {
        padding: 22px 16px;
    }

    .card-top h4 {
        font-size: 20px;
    }

    .card-top p {
        font-size: 14px;
    }

    /* FORM */
    .form-area {
        padding: 26px 18px;
    }

    .form-control {
        height: 48px;
        font-size: 14px;
    }

    .input-group-text {
        font-size: 16px;
    }

    /* BUTTON */
    .submit-btn {
        height: 50px;
        font-size: 15px;
    }

    /* HIDE LEFT PANEL ON MOBILE */
    .brand-panel {
        display: none;
    }
}
</style>

<div class="container-fluid register-section px-0">
    <div class="row w-100 align-items-center justify-content-center">

        <!-- LEFT SIDE -->
        <div class="col-lg-6 d-none d-lg-block">
            <div class="brand-panel">
                <span class="brand-badge">📝 Notes App</span>
                <h1>Write. Save. Organize.</h1>
                <p>
                    Manage your daily notes, ideas, and tasks in one place with a clean and powerful UI.
                </p>
            </div>
        </div>

        <!-- RIGHT SIDE FORM -->
        <div class="col-12 col-lg-6 col-xl-5">
            <div class="register-card">

                <div class="card-top">
                    <h4>Create Account</h4>
                    <p>Start your notes journey today</p>
                </div>

                <div class="form-area">
                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text">👤</span>
                                <input type="text" name="username" class="form-control"
                                    placeholder="Enter username" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text">📧</span>
                                <input type="email" name="email" class="form-control"
                                    placeholder="Enter email" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text">🔒</span>
                                <input type="password" name="password" class="form-control"
                                    placeholder="Create password" required>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn w-100">
                            Register Now
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        Already have an account?
                        <a href="/login" class="login-link">Login</a>
                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
