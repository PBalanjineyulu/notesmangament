{% extends "base.html" %}

{% block content %}

<style>
    .login-page {
        width: 100%;
        min-height: calc(100vh - 64px);
        padding: 0 16px 40px;
        margin-top: 0 !important;

        display: flex;
        align-items: center;
        justify-content: center;

        background:
            radial-gradient(circle at top left, rgba(59, 130, 246, 0.25), transparent 35%),
            radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.25), transparent 35%),
            linear-gradient(135deg, #020617 0%, #0f172a 45%, #ecfeff 45%, #ecfeff 100%);
    }

    .login-card {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 30px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
    }

    .login-header {
        background: linear-gradient(135deg, #22c55e, #3b82f6);
        padding: 28px;
        text-align: center;
        color: #fff;
    }

    .login-header h4 {
        margin: 0;
        font-weight: 900;
    }

    .login-header p {
        margin-top: 5px;
        font-size: 14px;
    }

    .login-body {
        padding: 32px;
    }

    .form-label {
        font-weight: 800;
        font-size: 14px;
    }

    .form-control {
        border-radius: 14px;
        padding: 12px;
        border: 1px solid #d1d5db;
    }

    .form-control:focus {
        border-color: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.25);
    }

    .login-btn {
        height: 50px;
        border-radius: 50px;
        border: none;
        font-weight: 900;
        color: white;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        transition: 0.3s;
    }

    .login-btn:hover {
        transform: translateY(-2px);
        color: #22c55e;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.3);
    }

    .login-links a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 600;
    }

    .login-links a:hover {
        text-decoration: underline;
    }

    /* MOBILE FIX */
    @media (max-width: 576px) {
        .login-page {
            min-height: calc(100vh - 64px);
            padding: 0 10px 30px;
        }

        .login-body {
            padding: 24px 18px;
        }

        .login-card {
            border-radius: 22px;
        }
    }
</style>

<section class="login-page">
    <div class="login-card">

        <div class="login-header">
            <h4>Welcome Back</h4>
            <p>Login to continue</p>
        </div>

        <div class="login-body">
            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control"
                        placeholder="Enter your email" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control"
                        placeholder="Enter your password" required>
                </div>

                <button class="login-btn w-100">
                    Login
                </button>

            </form>

            <div class="login-links text-center mt-3">
                <a href="/forgot">Forgot Password?</a>
            </div>

            <div class="login-links text-center mt-2">
                Don't have account?
                <a href="/register">Register</a>
            </div>
        </div>

    </div>
</section>

{% endblock %}
